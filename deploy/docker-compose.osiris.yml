# Osiris production stack for DO1-Achilles (45.55.224.170)
# Astra AI — osiris.m-i-n-d.ai + ozzie.m-i-n-d.ai
#
# Phase 1 uses the upstream prebuilt image (fast, no build RAM on the shared box).
# Phase 2+ swaps `image:` for our fork build once auth/Stripe/Ozzie UI land.
#
# Distinct project name + ports so the existing cc-bridge/OpenClaw services on
# DO1 are never touched. Caddy terminates TLS and reverse-proxies both subdomains.

name: osiris

services:
  osiris:
    # The upstream ghcr.io/aiacos/osiris image is private (unauthorized pull),
    # so we build our own from the fork source. `app/` is a clone of the OSIRIS
    # source placed next to this deploy dir on the host (see README).
    build:
      context: ../app
      dockerfile: Dockerfile
    image: osiris-local:latest
    container_name: osiris-app
    user: "0:0"                              # write access to the /data volume (watchlist)
    env_file:
      - path: ./.env.osiris
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OSIRIS_DATA_DIR=/data
    volumes:
      - osiris_data:/data                    # watchlist + small persistent state
    expose:
      - "3000"                               # internal only; Caddy fronts it
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [osiris_net]
    mem_limit: 1024m                          # hard cap so we can't starve cc-bridge/OpenClaw
    cpus: 1.0

  caddy:
    image: caddy:2-alpine
    container_name: osiris-caddy
    ports:
      - "80:80"                               # ACME HTTP-01 + redirect
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [osiris]
    restart: unless-stopped
    networks: [osiris_net]
    mem_limit: 128m

  cron:
    # Self-contained scheduler (inside this stack, not the host): fires Ozzie's
    # daily brief (12:00 UTC ≈ 08:00 ET) and watchlist scan (13:00 UTC).
    image: alpine:3
    container_name: osiris-cron
    env_file:
      - path: ./.env.osiris
        required: false
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null 2>&1 || true
        echo "osiris-cron up"
        last=""
        while true; do
          now=$$(date -u +%H:%M)
          if [ "$$now" != "$$last" ]; then
            case "$$now" in
              12:00) curl -s -X POST http://osiris:3000/api/ozzie/cron/daily-brief   -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              13:00) curl -s -X POST http://osiris:3000/api/ozzie/cron/watchlist-scan -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
            esac
            case "$${now#*:}" in
              00|20|40) curl -s -X POST http://osiris:3000/api/ozzie/cron/monitor-scan -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
            esac
            # 24/7 OSINT ingestion → @ozzie knowledge graph (staggered, capped)
            case "$${now#*:}" in
              05) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=cve"       -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              10|40) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=edgar"    -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              15) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=cyber"     -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              25|55) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=gdelt"    -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              35) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=quakes"    -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
              50) curl -s -X POST "http://osiris:3000/api/ozzie/ingest?source=contracts" -H "X-Cron-Secret: $$CRON_SECRET" || true ;;
            esac
            last="$$now"
          fi
          sleep 30
        done
    depends_on: [osiris]
    restart: unless-stopped
    networks: [osiris_net]
    mem_limit: 64m

  postgres:
    image: postgres:16-alpine
    container_name: osiris-postgres
    environment:
      - POSTGRES_USER=osiris
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=osiris
    volumes:
      - osiris_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks: [osiris_net]
    mem_limit: 512m                           # used from Phase 2 (auth/billing/watchlists)

networks:
  osiris_net:
    name: osiris_net

volumes:
  caddy_data:
  caddy_config:
  osiris_pgdata:
  osiris_data:
